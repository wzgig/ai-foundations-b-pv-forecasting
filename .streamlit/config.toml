[theme]
base = "light"
primaryColor = "#2b7783"
backgroundColor = "#f4f7f8"
secondaryBackgroundColor = "#e8eef0"
textColor = "#17201d"
linkColor = "#2b7783"
codeTextColor = "#24302c"
codeBackgroundColor = "#eef3f4"
borderColor = "#cfdbde"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Noto Sans SC':https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
headingFont = "'Noto Sans SC':https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["36px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#2b7783", "#315c49", "#d1912a", "#356b9a", "#b24545", "#6f7b55"]
chartSequentialColors = ["#f7fbfc", "#e8f3f5", "#d4e7eb", "#b7d5db", "#8ebdc7", "#659fab", "#4b8792", "#356f78", "#28585f", "#1b3d43"]
greenColor = "#315c49"
blueColor = "#2b7783"
orangeColor = "#d1912a"
redColor = "#b24545"
grayColor = "#5d6763"
dataframeBorderColor = "#cfdbde"
dataframeHeaderBackgroundColor = "#e8eef0"

[theme.sidebar]
backgroundColor = "#17201d"
secondaryBackgroundColor = "#24302c"
textColor = "#f7f4ea"
primaryColor = "#d1912a"
borderColor = "#314139"
